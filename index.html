<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IELTS 同义替换练习词库诊断">
    <title>IELTS 同义替换练习 · 数据诊断</title>
    <link rel="stylesheet" href="./css/base.css">
  </head>
  <body>
    <main class="diagnostic-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">阶段 0 · 项目初始化与数据验证</p>
          <h1>IELTS 同义替换练习</h1>
          <p class="subtitle">当前页面只验证词库结构与多分类索引，暂不提供答题功能。</p>
        </div>
        <span id="validation-badge" class="status-badge">正在检查</span>
      </header>

      <section aria-labelledby="summary-title">
        <h2 id="summary-title">词库概览</h2>
        <div id="summary-grid" class="summary-grid" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="issues-title">
        <div class="section-heading">
          <h2 id="issues-title">数据问题</h2>
          <p id="issue-count"></p>
        </div>
        <div id="issues"></div>
      </section>

      <section class="panel" aria-labelledby="multi-title">
        <div class="section-heading">
          <h2 id="multi-title">多分类词条抽样</h2>
          <p>用于确认 wordKey → 全部 group_id 索引。</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>显示词条</th><th>wordKey</th><th>所属分类</th></tr></thead>
            <tbody id="multi-word-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
