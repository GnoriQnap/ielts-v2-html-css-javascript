<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IELTS 英语词汇语义分类练习">
    <title>IELTS 同义替换练习</title>
    <link rel="stylesheet" href="./css/base.css">
  </head>
  <body>
    <main class="practice-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">阶段 3 · 复习调度与强化模式</p>
          <h1>IELTS 同义替换练习</h1>
        </div>
        <div class="mode-switch" role="group" aria-label="练习模式">
          <button id="mode-random" class="mode-button" type="button" aria-pressed="true">随机模式</button>
          <button id="mode-intensive" class="mode-button" type="button" aria-pressed="false">强化模式</button>
        </div>
      </header>

      <section id="practice-card" class="practice-card" aria-labelledby="word-heading">
        <div class="question-meta">
          <span id="question-type" class="question-type">准备题目</span>
        </div>
        <h2 id="word-heading" class="word">正在加载…</h2>
        <p id="question-prompt" class="prompt"></p>

        <div class="word-summary" aria-live="polite">
          <span id="word-status" class="word-status">状态：待学习</span>
        </div>

        <div
          id="options"
          class="options-grid"
          role="group"
          aria-label="中文语义分类选项"
        ></div>

        <p id="empty-state" class="empty-state" hidden>切换回随机模式可继续自由练习。</p>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="submit-answer" class="button button-primary" type="button">提交答案</button>
          <div id="decision-actions" class="decision-actions" hidden>
            <button id="mark-review" class="button button-secondary" type="button">加入待强化</button>
            <button id="mark-remembered" class="button button-primary" type="button">加入已记忆</button>
          </div>
          <button id="next-question" class="button button-primary" type="button" hidden>下一题</button>
        </div>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
